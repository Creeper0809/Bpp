
name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full_benchmarks:
        description: "Run separated benchmark job"
        type: boolean
        default: false
      full_fuzz:
        description: "Run separated fuzz smoke job"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils coreutils binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev

      - name: Build and test (Linux)
        env:
          BUILD_AND_TEST_PROFILE: fast
          TEST_SKIP_LLVM_BUILD: "1"
          TEST_JOBS: "4"
          TEST_PROGRESS: "1"
        run: |
          chmod +x build_and_test.sh test/run_tests.sh
          bash build_and_test.sh

      - name: Focused LLVM smoke tests (Linux)
        env:
          TEST_NAME_FILTER: "31_llvm_ll|32_llvm_ll|33_llvm_build|45_llvm_build|46_llvm_build|47_llvm_build"
          TEST_PROFILE: quick
          TEST_SKIP_LLVM_BUILD: "0"
          TEST_JOBS: "4"
          TEST_QUIET: "1"
          TEST_PROGRESS: "1"
          STRESS_RUNS: "0"
          STABILITY_RUNS: "0"
        run: |
          bash test/run_tests.sh bin/stage1

      - name: Diagnostics + manifest regression (Linux)
        run: |
          chmod +x test/run_regression.sh
          bash test/run_regression.sh

      - name: Cross-build Windows bootstrap seed
        run: |
          chmod +x tools/build_windows_bootstrap.sh
          tools/build_windows_bootstrap.sh "$PWD/build/windows-ci-seed/bpp-windows-seed.exe"

      - name: Upload Windows bootstrap seed
        uses: actions/upload-artifact@v4
        with:
          name: windows-cross-bootstrap
          path: build/windows-ci-seed/bpp-windows-seed.exe
          if-no-files-found: error
          retention-days: 1

      - name: CMake install + bpp CLI smoke (Linux)
        run: |
          cmake -S . -B build-linux
          cmake --build build-linux --target toolchain-check
          cmake --install build-linux --prefix "$PWD/.local"
          ./.local/bin/bpp test/source/01_generics.bpp

  windows:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download cross-built Windows seed
        uses: actions/download-artifact@v4
        with:
          name: windows-cross-bootstrap
          path: build/windows-ci-seed

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure toolchain with CMake
        run: |
          cmake -S . -B build-win -DBPP_BOOTSTRAP_NASM=ON -DBPP_BOOTSTRAP_COMPILER=OFF

      - name: Export resolved toolchain paths
        shell: pwsh
        run: |
          Get-Content build-win/bpp_toolchain.env | ForEach-Object {
            if ($_ -match '^(.*?)=(.*)$') {
              "$($matches[1])=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Toolchain check + Windows executable smoke test
        run: |
          cmake --build build-win --target toolchain-check windows-smoke

      - name: Toolchain-only sanity via PowerShell runner
        shell: pwsh
        run: |
          ./build_and_test.ps1 -ToolchainOnly -NasmPath "$env:BPP_NASM_EXECUTABLE" -LinkerPath "$env:BPP_LINKER_EXECUTABLE"

      - name: Full Windows self-host and compiler tests
        shell: pwsh
        run: |
          $compilerExe = (Resolve-Path "build/windows-ci-seed/bpp-windows-seed.exe").Path
          ./build_and_test.ps1 `
            -CompilerPath $compilerExe `
            -NasmPath "$env:BPP_NASM_EXECUTABLE" `
            -LinkerPath "$env:BPP_LINKER_EXECUTABLE"

  performance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_benchmarks }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils coreutils clang

      - name: Build fast stage compiler
        env:
          BUILD_AND_TEST_PROFILE: fast
          TEST_SKIP_LLVM_BUILD: "1"
          TEST_JOBS: "4"
          TEST_PROGRESS: "1"
        run: |
          chmod +x build_and_test.sh test/run_tests.sh
          bash build_and_test.sh

      - name: Run microbenchmarks
        env:
          COMPILER: ${{ github.workspace }}/bin/stage1
          RUNS: "5"
          OPT_LEVELS: "O1 O2"
          OUT_DIR: ${{ github.workspace }}/build/microbench-ci
        run: |
          chmod +x bench/run_microbench.sh bench/run_tagged_pointer_fastpaths.sh bench/run_incremental_cache_probe.sh
          bash bench/run_microbench.sh
          OUT_DIR=${{ github.workspace }}/build/incremental-cache-ci bash bench/run_incremental_cache_probe.sh

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: microbench-reports
          path: |
            build/microbench-ci/bench_report.tsv
            build/microbench-ci/optimization_report.tsv
            build/microbench-ci/comparison_report.tsv
            build/microbench-ci/optimization_thresholds.tsv
            build/incremental-cache-ci/incremental_cache_report.tsv

  fuzz:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_fuzz }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fuzz dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils coreutils

      - name: Build fast stage compiler
        env:
          BUILD_AND_TEST_PROFILE: fast
          TEST_SKIP_LLVM_BUILD: "1"
          TEST_JOBS: "4"
          TEST_PROGRESS: "1"
        run: |
          chmod +x build_and_test.sh test/run_tests.sh
          bash build_and_test.sh

      - name: Run differential fuzz smoke
        env:
          COMPILER: ${{ github.workspace }}/bin/stage1
          COUNT: "100"
          OUT_DIR: ${{ github.workspace }}/build/fuzz-smoke-ci
        run: |
          chmod +x test/fuzz_smoke.sh
          bash test/fuzz_smoke.sh

      - name: Upload fuzz reports
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-reports
          path: |
            build/fuzz-smoke-ci/fuzz_smoke_report.tsv
